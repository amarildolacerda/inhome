# Flutter Web SPA — client-side routing needs history fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads entram como JSON base64 (+~33% do arquivo). O backend autoriza
    # 2 MB por arquivo (upload.js MAX_UPLOAD_BYTES); sem este teto o default
    # de 1 MB do nginx devolve 413 em HTML antes de chegar no backend e o
    # app só mostra o fallback genérico. 4 MB cobre o JSON de 2 MB com folga.
    client_max_body_size 4m;

    # Same-origin proxy: the app calls relative /api and /socket.io
    # (frontend/lib/services/api_service.dart); nginx forwards both to the
    # backend service on the compose network (DNS name "backend", port 3001).
    location ^~ /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin evidence proxy (FR-007/FR-008, AD-001): ^~ vence o regex de
    # cache e o fallback do SPA; o caminho /uploads/ chega intacto no backend.
    location ^~ /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Flutter build artifacts; index.html always revalidates.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

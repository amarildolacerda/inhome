openapi: 3.0.3
info:
  title: Régua de notificação configurável — E023
  version: 1.0.0
  description: Configuração de régua por domínio/tipo de evento e leitura dos lembretes no painel de vencimentos.
servers:
  - url: http://localhost:3001
security:
  - bearerAuth: []
paths:
  /api/v2/alerts/rules:
    get:
      summary: Listar régua ativa e etapas do domínio
      responses:
        '200':
          description: Lista de réguas
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRule'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/alerts/rules/{eventType}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    put:
      summary: Criar ou atualizar régua com etapas derivadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleInput'
      responses:
        '200':
          description: Régua gravada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Ativar ou desativar régua sem apagar eventos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/alerts/panel:
    get:
      summary: Painel de vencimentos com réguas e lembretes emitidos
      responses:
        '200':
          description: Painel enriquecido
          content:
            application/json:
              schema:
                type: object
                required: [windows, rules, reminders]
                properties:
                  windows:
                    type: array
                    items:
                      type: integer
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRule'
                  reminders:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReminderEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventType:
      name: eventType
      in: path
      required: true
      schema:
        type: string
      description: Tipo de evento suportado pelo motor de alertas, inicialmente vigencia.
  schemas:
    RuleInput:
      type: object
      required: [maxReminders, intervalDays, active]
      properties:
        maxReminders:
          type: integer
          minimum: 1
          maximum: 5
        intervalDays:
          type: integer
          minimum: 1
        active:
          type: boolean
    NotificationRule:
      allOf:
        - $ref: '#/components/schemas/RuleInput'
        - type: object
          required: [eventType, steps, createdBy, createdAt]
          properties:
            eventType:
              type: string
            steps:
              type: array
              items:
                $ref: '#/components/schemas/RuleStep'
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedBy:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
    RuleStep:
      type: object
      required: [step, windowDays]
      properties:
        step:
          type: integer
        windowDays:
          type: integer
    ReminderEvent:
      type: object
      required: [contractId, eventType, step, channel, status]
      properties:
        contractId:
          type: integer
        eventType:
          type: string
        step:
          type: integer
        windowDays:
          type: integer
        channel:
          type: string
          enum: [in_app, email]
        status:
          type: string
          enum: [skipped, sent, failed]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Configuração inválida; nada foi gravado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Papel ou domínio não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

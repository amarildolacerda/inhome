openapi: 3.0.3
info:
  title: "InHome — Workflow Assistido por OpenCode (E0003)"
  version: 0.1.0
  description: |
    API do feature 00003 — Workflow Assistido por OpenCode a partir das Definições do Contrato.

    Autoridade (spec, Clarifications 2026-10-06): somente `gestor` dispara geração
    (análise e plano de execução), aprova sugestões e aplica revisões. `admin` edita
    apenas definições. `prestador` lê o workflow
    aprovado e os planos das próprias tarefas.

    Padrão assíncrono (FR-018): POST responde 202 com header `Location` apontando para
    o recurso de estado; o cliente faz polling no GET indicado. Transições do job de
    análise também são anunciadas na sala Socket.io do domínio (`x-socket-events`),
    no mesmo modelo do evento existente `task:updated`.

    Máquina de estados da análise (AD-002): `pendente` → `analisando` → `sugerido` |
    `falha`. `falha` preserva as definições e libera somente retry manual, sem retry
    automático (FR-006/FR-018). Timeout configurável padrão 60000 ms; 30000 ms é meta
    de UX (SC-002), não é configurável. Após aprovação o status vira `aprovada`.

    Revisão na vigência (US7): mesmo modelo assíncrono, iniciada só por gatilho manual
    do gestor (FR-024). A aplicação aprovada edita e cria tarefas somente em `A Fazer`,
    nunca remove nem fecha; alvo em andamento/concluído vira conflito devolvido na
    resposta (FR-023, Glossário "Conflito").

    Escopo de domínio (FR-019): todo caminho `:id` é resolvido dentro do domínio do
    token (`req.user.domainId`). O domínio nunca é aceito de params, query ou body.
    Recurso inexistente ou de outro domínio responde 404.

    Listagens (histórico de definições, versões de sugestão e revisões) são completas
    e restritas ao contrato, ordenadas do mais recente para o mais antigo; esta
    release não pagina, pois o conjunto é limitado ao contrato.

    Erros: corpo `{ "error": "..." }` em todos os códigos de erro. 401 = token ausente;
    403 = token inválido/expirado, domínio suspenso ou papel não autorizado.
servers:
  - url: /
    description: "Mesmo origin (nginx :80) ou backend local na porta 3001"
security:
  - bearerAuth: []
tags:
  - name: Definitions
    description: "Definições versionadas do contrato (US1)"
  - name: Analysis
    description: "Geração assíncrona da sugestão pelo OpenCode (US2)"
  - name: Suggestions
    description: "Revisão, refino e aprovação da sugestão (US3)"
  - name: Workflow
    description: "Workflow oficial do contrato e opt-in de tarefa manual (US4)"
  - name: Review
    description: "Revisão na vigência, aplicação e conflitos (US7)"
  - name: ExecutionPlan
    description: "Plano de execução por tarefa (US5)"
  - name: Config
    description: "Configuração da integração OpenCode (timeout, allowlist)"
paths:
  /api/contracts/{id}/definitions:
    get:
      tags: [Definitions, FR-001, FR-019]
      summary: "Obter definições atuais do contrato"
      description: |
        Retorna a versão ativa das 6 definições do FR-001 (finalidade, limitações,
        alvo, escopo, premissas, entregáveis). Sem definições salvas responde 404.
        Escopo de domínio: `req.user.domainId` (JWT); `:id` resolvido só dentro do
        domínio — domínio divergente responde 404. Só admin e gestor (FR-002/FR-019).
      operationId: getDefinitions
      x-fr: [FR-001, FR-019]
      x-roles: [admin, gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Definições atuais"
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    $ref: '#/components/schemas/ContractDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Definitions, FR-001, FR-002, FR-019]
      summary: "Salvar definições (cria nova versão)"
      description: |
        Valida as 6 definições obrigatórias no salvamento e grava uma nova versão por
        contrato (FR-001/FR-002); as anteriores permanecem em `/definitions/history`
        (FR-017). Validação de payload responde 400 `{ error: "Validation failed", details }`;
        definição vazia responde 400 com `missing`. Escopo de domínio: `req.user.domainId`.
        Só admin e gestor (FR-002/FR-019); admin não gera nem aprova.
      operationId: saveDefinitions
      x-fr: [FR-001, FR-002, FR-019]
      x-roles: [admin, gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionInput'
      responses:
        '200':
          description: "Nova versão salva"
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    $ref: '#/components/schemas/ContractDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/definitions/history:
    get:
      tags: [Definitions, FR-002, FR-017, FR-019]
      summary: "Histórico de versões de definições"
      description: |
        Lista as versões de definições com autor e data (FR-017), mais recente primeiro.
        Escopo de domínio: `req.user.domainId`; `:id` resolvido só dentro do domínio.
        Só admin e gestor (FR-002/FR-019).
      operationId: getDefinitionHistory
      x-fr: [FR-002, FR-017, FR-019]
      x-roles: [admin, gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Versões com autor e data"
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefinitionHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/analysis:
    post:
      tags: [Analysis, FR-003, FR-004, FR-018, FR-020, FR-021, FR-019]
      summary: "Disparar análise da lista no OpenCode (assíncrono)"
      description: |
        Enfileira o job de análise e responde 202; `Location` aponta para o recurso de
        estado consultado por polling (FR-021). O payload enviado ao OpenCode é montado
        no servidor a partir da allowlist (6 definições + identificação + vigência do
        contrato), sem partes, CNPJ, valores ou contatos (FR-004/FR-020).
        Sem definições obrigatórias responde 400 com `missing` (FR-003). Integração
        desabilitada responde 400. Com job em andamento (`pendente`/`analisando`)
        responde 409. Timeout configurável (padrão 60000 ms) marca `falha` com retry
        manual, sem retry automático (FR-018); resposta vazia ou não interpretável
        também vira `falha`, nunca sugestão (FR-006). Nova execução a partir de
        `sugerido` ou `aprovada` cria outra versão de sugestão sem trocar o workflow
        ativo (uma nova aprovação é necessária).
        Escopo de domínio: `req.user.domainId`; só gestor dispara geração (FR-019).
      operationId: startAnalysis
      x-fr: [FR-003, FR-004, FR-005, FR-018, FR-019, FR-020, FR-021]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisInput'
      responses:
        '202':
          description: "Análise aceita; consulte o Location para acompanhar o estado"
          headers:
            Location:
              description: "Recurso de estado da análise"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [analysis]
                properties:
                  analysis:
                    $ref: '#/components/schemas/AnalysisState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    get:
      tags: [Analysis, FR-005, FR-006, FR-021, FR-019]
      summary: "Estado da geração (polling)"
      description: |
        Recurso de estado da análise — polling sem recarregar a tela (FR-021). Estados
        `pendente | analisando | sugerido | falha` (AD-002), `aprovada` após aprovação.
        Em `sugerido` devolve os itens com justificativa por item (FR-005). Em `falha`
        o campo `error` explica a falha, as definições ficam preservadas e o retry fica
        liberado (FR-006); o evento de domínio `analysis_state` complementa o polling
        (FR-021). Sem análise registrada responde 404.
        Escopo de domínio: `req.user.domainId`; só gestor (FR-019); sugestões nunca
        aparecem para prestador (FR-013).
      operationId: getAnalysisState
      x-fr: [FR-005, FR-006, FR-019, FR-021]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Estado atual da análise"
          content:
            application/json:
              schema:
                type: object
                required: [analysis]
                properties:
                  analysis:
                    $ref: '#/components/schemas/AnalysisState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/analysis/retry:
    post:
      tags: [Analysis, FR-006, FR-018, FR-021, FR-019]
      summary: "Retry manual da análise após falha"
      description: |
        Reexecuta o job quando o estado é `falha` e responde 202 com novo `Location`
        para polling. Retentativas automáticas não existem nesta release (FR-018);
        qualquer estado diferente de `falha` responde 409. As definições nunca são
        apagadas pela falha (FR-006/SC-003).
        Escopo de domínio: `req.user.domainId`; só gestor (FR-019).
      operationId: retryAnalysis
      x-fr: [FR-006, FR-018, FR-019, FR-021]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '202':
          description: "Retry aceito"
          headers:
            Location:
              description: "Recurso de estado da análise"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [analysis]
                properties:
                  analysis:
                    $ref: '#/components/schemas/AnalysisState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/suggestions:
    get:
      tags: [Suggestions, FR-008, FR-017, FR-019]
      summary: "Listar versões de sugestão do contrato"
      description: |
        Lista as versões de sugestão do contrato (mais recente primeiro). Refinos criam
        novas versões sem apagar as anteriores (FR-008) e o histórico fica consultável
        (FR-017). Lista vazia quando ainda não há análise.
        Escopo de domínio: `req.user.domainId`; só gestor (FR-019).
      operationId: listSuggestions
      x-fr: [FR-008, FR-017, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Versões de sugestão"
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/suggestions/{sid}:
    get:
      tags: [Suggestions, FR-005, FR-007, FR-019]
      summary: "Detalhe da sugestão com itens"
      description: |
        Detalhe da sugestão e dos itens (com `id`, base para edição em FR-007). O
        caminho é top-level conforme o plano (`/api/suggestions/:sid`); o contrato do
        item é resolvido pelo domínio do token, nunca por parâmetro de domínio.
        Escopo de domínio: `req.user.domainId`; sugestão de outro domínio responde 404;
        só gestor (FR-019).
      operationId: getSuggestion
      x-fr: [FR-005, FR-007, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
      responses:
        '200':
          description: "Sugestão com itens"
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion:
                    $ref: '#/components/schemas/TaskSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/suggestions/{sid}/items/{itemId}:
    patch:
      tags: [Suggestions, FR-007, FR-019]
      summary: "Editar ou remover um item da sugestão"
      description: |
        Edita título, descrição ou justificativa do item, ou marca a remoção enviando
        `removed: true` (não existe DELETE — remoção é estado do item,
        FR-007). Permitido somente enquanto a sugestão está `sugerido`; qualquer outro
        estado responde 409. Só gestor edita e remove itens; admin e prestador recebem
        403 (FR-007/FR-019).
        Escopo de domínio: sugestão resolvida dentro de `req.user.domainId`.
      operationId: updateSuggestionItem
      x-fr: [FR-007, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionItemInput'
      responses:
        '200':
          description: "Item atualizado"
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/SuggestionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/suggestions/{sid}/refine:
    post:
      tags: [Suggestions, FR-008, FR-019]
      summary: "Refinar sugestão (cria nova versão)"
      description: |
        Envia instruções livres de refinamento e devolve uma nova versão da sugestão
        com `refinamento_de` apontando a anterior; a versão anterior não é apagada
        (FR-008, AD-006). `instrucoes` é obrigatório e não vazio (400). Permitido
        somente com a sugestão em `sugerido`; com job em andamento ou já aprovada
        responde 409 (refaça uma nova análise).
        Escopo de domínio: sugestão resolvida dentro de `req.user.domainId`; só gestor (FR-019).
      operationId: refineSuggestion
      x-fr: [FR-008, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineInput'
      responses:
        '201':
          description: "Nova versão da sugestão criada"
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion:
                    $ref: '#/components/schemas/TaskSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/suggestions/{sid}/approve:
    post:
      tags: [Suggestions, FR-007, FR-009, FR-010, FR-012, FR-019]
      summary: "Aprovar sugestão e ativar o workflow"
      description: |
        Aprovação materializa os itens mantidos/editados como tarefas oficiais do
        contrato (FR-010, AD-003) e cria a versão de workflow `ativo`, substituindo a
        anterior. Exige ao menos um item não removido — lista vazia responde 400
        (FR-009/SC-004). Estado diferente de `sugerido` responde 409. Emite
        `workflow_activated` na sala do domínio (FR-012/SC-005). Só gestor aprova;
        admin e prestador recebem 403 (FR-007/FR-019).
        Escopo de domínio: sugestão resolvida dentro de `req.user.domainId`.
      operationId: approveSuggestion
      x-fr: [FR-007, FR-009, FR-010, FR-012, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
      responses:
        '201':
          description: "Workflow ativado com as tarefas materializadas"
          content:
            application/json:
              schema:
                type: object
                required: [workflow, tasks]
                properties:
                  workflow:
                    $ref: '#/components/schemas/WorkflowVersion'
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/workflow:
    get:
      tags: [Workflow, FR-010, FR-011, FR-013, FR-019]
      summary: "Workflow ativo do contrato"
      description: |
        Devolve a versão de workflow ativa (ou `null` se nunca aprovada) e as tarefas
        do contrato. `workflow` segue o fluxo e os vínculos existentes (FR-011).
        `prestador` vê somente as tarefas do workflow aprovado (`in_workflow: true`)
        e recebe 404 quando não está vinculado ao contrato (FR-013); `admin` e
        `gestor` veem todas as tarefas do contrato, com `in_workflow` marcando o que
        já está na lista — flag usada para o opt-in de tarefa manual (FR-010).
        Escopo de domínio: `req.user.domainId`; `:id` resolvido só dentro do domínio.
      operationId: getWorkflow
      x-fr: [FR-010, FR-011, FR-013, FR-019]
      x-roles: [admin, gestor, prestador]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Workflow ativo e tarefas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/workflow/tasks/{taskId}/opt-in:
    post:
      tags: [Workflow, FR-010, FR-019]
      summary: "Opt-in do gestor para tarefa criada fora da lista"
      description: |
        Tarefa criada fora da lista aprovada só entra no workflow com confirmação do
        gestor (FR-010): o endpoint marca a tarefa como `in_workflow: true`. A tarefa
        precisa pertencer ao contrato do caminho — contrato divergente responde 400.
        Já optada responde 409. Só gestor (FR-019); admin e prestador recebem 403.
        Não emite eventos (mesmo comportamento da edição de campos em `PUT /api/tasks/:id`).
        Escopo de domínio: `req.user.domainId`; tarefa de outro domínio responde 404.
      operationId: optInManualTask
      x-fr: [FR-010, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: "Tarefa incluída no workflow"
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: '#/components/schemas/WorkflowTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/review:
    post:
      tags: [Review, FR-022, FR-024, FR-019]
      summary: "Iniciar revisão na vigência (assíncrono)"
      description: |
        Gatilho manual do gestor, sem reanálise automática (FR-024). Carrega as
        definições e as tarefas atuais do contrato e enfileira a proposta de revisão,
        que fica `aguardando aprovação` (FR-022) — responde 202 com `Location` para o
        recurso da revisão. Se houver análise em andamento, a revisão entra em
        `pendente` e só inicia quando a anterior concluir (Edge Case: revisão durante
        análise aguarda a anterior). Com revisão já em andamento responde 409.
        Escopo de domínio: `req.user.domainId`; só gestor inicia revisão (FR-019).
      operationId: startReview
      x-fr: [FR-019, FR-022, FR-024]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '202':
          description: "Revisão aceita; consulte o Location para acompanhar o estado"
          headers:
            Location:
              description: "Recurso de estado da revisão"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    $ref: '#/components/schemas/ReviewSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    get:
      tags: [Review, FR-022, FR-019]
      summary: "Listar revisões do contrato"
      description: |
        Lista as revisões do contrato (mais recente primeira) para localizar a revisão
        pendente depois de recarregar a tela (FR-022). Escopo de domínio:
        `req.user.domainId`; só gestor (FR-019); domínio divergente responde 404.
      operationId: listReviews
      x-fr: [FR-019, FR-022]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: "Revisões do contrato"
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/review/{rid}:
    get:
      tags: [Review, FR-022, FR-023, FR-019]
      summary: "Estado da revisão, propostas e conflitos"
      description: |
        Recurso de estado da revisão (polling): definições e tarefas atuais carregadas
        no início (FR-022), propostas (`criar`/`editar`) com justificativa, conflitos
        já registrados e status `pendente | analisando | sugerido | falha | aprovada`
        (FR-023). Em `falha`, `error` explica e o retry manual fica disponível —
        definições e tarefas nunca são alteradas por uma falha.
        Escopo de domínio: `req.user.domainId`; revisão de outro domínio responde 404;
        só gestor (FR-019).
      operationId: getReview
      x-fr: [FR-019, FR-022, FR-023]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: "Revisão com contexto, propostas e conflitos"
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/review/{rid}/apply:
    post:
      tags: [Review, FR-023, FR-019]
      summary: "Aprovar e aplicar a revisão"
      description: |
        Aprovação e aplicação em um passo (FR-023): edita e cria tarefas somente em
        `A Fazer`, nunca remove nem fecha; tarefas em andamento ou concluídas ficam
        intactas e a mudança delas vira conflito. A resposta é 200 mesmo com conflitos
        (plan — Error Handling Strategy), com `conflicts` listando os não aplicados e
        `applied` contando edições e criações. Sem propostas responde 400; estado
        diferente de `sugerido` responde 409. Tarefas criadas emitem `task:updated`
        (action `created`) na sala do domínio, como em `POST /api/contracts/:id/tasks`.
        Escopo de domínio: `req.user.domainId`; só gestor aplica (FR-019).
      operationId: applyReview
      x-fr: [FR-019, FR-023]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: "Revisão aplicada, com conflitos sinalizados"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/contracts/{id}/review/{rid}/retry:
    post:
      tags: [Review, FR-022, FR-024, FR-019]
      summary: "Retry manual da revisão após falha"
      description: |
        Reexecuta o job da revisão quando o estado é `falha` e responde 202 com novo
        `Location`. Mesma política da análise: retry manual, sem retry automático
        (FR-018 aplicado à integração); qualquer estado diferente de `falha` responde
        409. Escopo de domínio: `req.user.domainId`; só gestor (FR-019).
      operationId: retryReview
      x-fr: [FR-019, FR-022, FR-024]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '202':
          description: "Retry aceito"
          headers:
            Location:
              description: "Recurso de estado da revisão"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    $ref: '#/components/schemas/ReviewSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/tasks/{id}/execution-plan:
    get:
      tags: [ExecutionPlan, FR-014, FR-015, FR-016, FR-019]
      summary: "Plano de execução da tarefa"
      description: |
        Plano obrigatório com passos, critérios verificáveis e riscos (FR-014),
        gerado depois da ativação sem bloqueá-la e visível no detalhe de gestor e
        prestador (FR-015). O plano não altera status, conclusão, fotos nem histórico
        (FR-016); sem plano ainda devolve `plan: null`. `prestador` acessa apenas as
        próprias tarefas vinculadas — tarefa alheia responde 404 (convenção de
        `GET /api/tasks/:id`).
        Escopo de domínio: `req.user.domainId`; tarefa de outro domínio responde 404.
      operationId: getExecutionPlan
      x-fr: [FR-014, FR-015, FR-016, FR-019]
      x-roles: [gestor, prestador]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: "Plano atual da tarefa"
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/ExecutionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [ExecutionPlan, FR-014, FR-015, FR-019]
      summary: "Solicitar geração do plano de execução"
      description: |
        Enfileira a geração do plano pelo OpenCode (AD-001/AD-007) e responde 202 com
        `Location` para polling — a ativação do workflow já enfileira o plano de cada
        tarefa aprovada sem esperar a geração (FR-015). Com geração já pendente
        responde 409. Estado `falha` libera a regeneração.
        Escopo de domínio: `req.user.domainId`; só gestor dispara geração (FR-019).
      operationId: requestExecutionPlan
      x-fr: [FR-014, FR-015, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: "Geração aceita; consulte o Location para acompanhar o estado"
          headers:
            Location:
              description: "Recurso do plano de execução"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    $ref: '#/components/schemas/ExecutionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/tasks/{id}/execution-plan/regenerate:
    post:
      tags: [ExecutionPlan, FR-015, FR-019]
      summary: "Regenerar plano após falha"
      description: |
        Regeneração manual do plano em caso de `falha` (FR-015), sempre via novo job
        assíncrono — responde 202 com `Location`. Com geração pendente responde 409.
        Só gestor regenera (autoridade de geração, FR-019); admin e prestador recebem 403.
        Escopo de domínio: `req.user.domainId`; tarefa de outro domínio responde 404.
      operationId: regenerateExecutionPlan
      x-fr: [FR-015, FR-019]
      x-roles: [gestor]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: "Regeneração aceita"
          headers:
            Location:
              description: "Recurso do plano de execução"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    $ref: '#/components/schemas/ExecutionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /api/opencode/config:
    get:
      tags: [Config, FR-018, FR-020, FR-019]
      summary: "Ler configuração da integração OpenCode"
      description: |
        Estado da integração: `enabled`, `timeout_ms` (padrão 60000 — ao estourar o job
        marca `falha` e libera retry manual, sem retry automático, FR-018) e
        `context_allowlist` somente leitura com os campos enviados ao OpenCode
        (6 definições + identificação + vigência — FR-004/FR-020). Escopo de domínio:
        `req.user.domainId`; admin e gestor (FR-019).
      operationId: getOpencodeConfig
      x-fr: [FR-018, FR-019, FR-020]
      x-roles: [admin, gestor]
      responses:
        '200':
          description: "Configuração atual"
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: '#/components/schemas/OpencodeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Config, FR-018, FR-019]
      summary: "Configurar timeout e habilitação da integração"
      description: |
        Ajusta `enabled` e `timeout_ms` da integração (NEW-CONFIG). `timeout_ms`
        mínimo 1000; o padrão é 60000 (FR-018). Jobs em andamento mantêm o timeout
        com o qual foram iniciados. Escopo de domínio: `req.user.domainId`; só
        gestor (FR-019/FR-002) — admin edita apenas as definições do contrato,
        nunca a configuração (Clarifications Q1).
      operationId: updateOpencodeConfig
      x-fr: [FR-018, FR-019]
      x-roles: [gestor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpencodeConfigInput'
      responses:
        '200':
          description: "Configuração atualizada"
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: '#/components/schemas/OpencodeConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por `POST /api/auth/login` com payload `{ id, email, role, domainId }`.
        Header `Authorization: Bearer <token>`. Token ausente responde 401; token
        inválido/expirado, domínio suspenso ou papel fora de `x-roles` responde 403.
        O domínio do recurso vem sempre do `domainId` do token (`req.user.domainId`) —
        nunca de params, query ou body (FR-019). A sala Socket.io usa o mesmo JWT no
        handshake e entra em `domain_<domainId>` validado pelo token.
  parameters:
    ContractId:
      name: id
      in: path
      required: true
      description: "ID do contrato; resolvido somente dentro do domínio do JWT"
      schema:
        type: integer
    SuggestionId:
      name: sid
      in: path
      required: true
      description: "ID da sugestão; resolvido somente dentro do domínio do JWT"
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      description: "ID do item da sugestão"
      schema:
        type: integer
    ReviewId:
      name: rid
      in: path
      required: true
      description: "ID da revisão; resolvido somente dentro do domínio do JWT"
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      description: "ID da tarefa; resolvido somente dentro do domínio do JWT"
      schema:
        type: integer
  responses:
    BadRequest:
      description: |
        Payload inválido (middleware `validate`, `{ error: "Validation failed", details }`)
        ou regra de negócio (400 + `{ error }`, ex.: `missing` das definições em FR-003
        e aprovação vazia em FR-009).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Unauthorized:
      description: "Token ausente — `{ error: \"Access token required\" }`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Token inválido/expirado, domínio suspenso ou papel não autorizado —
        `{ error: "Forbidden" | "Invalid or expired token" | "Domain suspended" }`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: "Recurso inexistente ou de outro domínio — `{ error: \"... not found\" }`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: "Estado atual não permite a operação — `{ error: \"...\" }`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: "Erro interno — `{ error: \"...\" }`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      description: "Formato de erro de todos os endpoints"
      properties:
        error:
          type: string
    BadRequestError:
      type: object
      required: [error]
      description: |
        Erro de 400. `missing` lista definições obrigatórias ausentes (FR-003);
        `details` traz as falhas do middleware `validate`.
      properties:
        error:
          type: string
        missing:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            type: string
    DefinitionInput:
      type: object
      required: [finalidade, limitacoes, alvo, escopo, premissas, entregaveis]
      description: "As 6 definições obrigatórias do contrato (FR-001/FR-004)"
      properties:
        finalidade:
          type: string
          minLength: 1
          maxLength: 5000
        limitacoes:
          type: string
          minLength: 1
          maxLength: 5000
        alvo:
          type: string
          minLength: 1
          maxLength: 5000
        escopo:
          type: string
          minLength: 1
          maxLength: 5000
        premissas:
          type: string
          minLength: 1
          maxLength: 5000
        entregaveis:
          type: string
          minLength: 1
          maxLength: 5000
    ContractDefinition:
      type: object
      required: [id, contract_id, versao, finalidade, limitacoes, alvo, escopo, premissas, entregaveis]
      description: |
        Versão de definições do contrato (`contract_definitions`). `created_at` é
        gravado pelo SQLite (`datetime('now')`, UTC).
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        versao:
          type: integer
          description: "Número da versão dentro do contrato (FR-002)"
        finalidade:
          type: string
        limitacoes:
          type: string
        alvo:
          type: string
        escopo:
          type: string
        premissas:
          type: string
        entregaveis:
          type: string
        autor_id:
          type: integer
        created_at:
          type: string
    DefinitionHistoryEntry:
      type: object
      required: [versao, autor_id, created_at, snapshot]
      description: "Entrada do histórico de definições (FR-017) — versão com autor e data"
      properties:
        versao:
          type: integer
        autor_id:
          type: integer
        user_name:
          type: string
          nullable: true
          description: "Nome do autor, convenção `user_name` do histórico existente"
        created_at:
          type: string
        snapshot:
          $ref: '#/components/schemas/ContractDefinition'
    AnalysisInput:
      type: object
      additionalProperties: false
      description: |
        Sem campos de cliente: o payload enviado ao OpenCode é montado no servidor
        pela allowlist (6 definições + identificação e vigência do contrato —
        FR-004/FR-020). Corpo opcional e sem propriedades; texto livre do
        chamador não é aceito, persistido nem enviado.
    AnalysisState:
      type: object
      required: [contract_id, status]
      description: |
        Recurso de estado da geração (FR-021). `items` só acompanha `sugerido` e
        `aprovada`. `error` só acompanha `falha` e nunca apaga as definições (FR-006).
      properties:
        contract_id:
          type: integer
        suggestion_id:
          type: integer
          nullable: true
          description: "Sugestão da rodada atual; nula antes de `sugerido`"
        definition_version:
          type: integer
          nullable: true
          description: "Versão de definições usada na análise"
        status:
          type: string
          enum: [pendente, analisando, sugerido, falha, aprovada]
        error:
          type: string
          nullable: true
          description: "Motivo da falha; retry manual liberado quando presente (FR-006)"
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionItem'
        updated_at:
          type: string
    TaskSuggestion:
      type: object
      required: [id, contract_id, definition_version, status]
      description: |
        Sugestão de tarefas (`task_suggestions`) com estado `pendente | analisando |
        sugerido | falha | aprovada` (AD-002). Refinos gravam `refinamento_de`
        apontando a versão anterior (FR-008).
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        definition_version:
          type: integer
        status:
          type: string
          enum: [pendente, analisando, sugerido, falha, aprovada]
        erro:
          type: string
          nullable: true
        refinamento_de:
          type: integer
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionItem'
    SuggestionItem:
      type: object
      required: [id, suggestion_id, titulo, justificativa, removed, ordem]
      description: "Item sugerido com justificativa por item (FR-005) e marcação de remoção"
      properties:
        id:
          type: integer
        suggestion_id:
          type: integer
        titulo:
          type: string
        descricao:
          type: string
          nullable: true
        justificativa:
          type: string
        removed:
          type: boolean
          default: false
          description: "true marca o item removido pelo gestor; a aprovação conta os itens com `removed = 0` (FR-007/FR-009)"
        ordem:
          type: integer
    SuggestionItemInput:
      type: object
      minProperties: 1
      description: |
        Edição de item (FR-007). Envie campos para editar e
        `removed: true` para remover — remoção não tem endpoint DELETE.
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        descricao:
          type: string
          maxLength: 5000
        justificativa:
          type: string
          maxLength: 5000
        removed:
          type: boolean
    RefineInput:
      type: object
      required: [instrucoes]
      description: "Instruções de refinamento (FR-008)"
      properties:
        instrucoes:
          type: string
          minLength: 1
          maxLength: 5000
    WorkflowVersion:
      type: object
      required: [id, contract_id, suggestion_id, status]
      description: "Versão do workflow (`workflow_versions`); uma `ativo` por contrato"
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        suggestion_id:
          type: integer
        status:
          type: string
          enum: [ativo, substituido]
        created_by:
          type: integer
        created_at:
          type: string
    WorkflowTask:
      type: object
      required: [id, contract_id, title, status, in_workflow]
      description: |
        Resumo de tarefa nos recursos de workflow/revisão — segue os campos reais de
        `tasks` (`Task.decorate` acrescenta `assignee_name`, `contract_name` etc.).
        `status` segue o fluxo existente `A Fazer → Em Progresso → Revisão → Concluída`
        (FR-011). `in_workflow` marca a pertinência à lista aprovada (FR-010).
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: ['A Fazer', 'Em Progresso', 'Revisão', 'Concluída']
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignee_id:
          type: integer
          nullable: true
        assignee_name:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        in_workflow:
          type: boolean
          description: "true quando a tarefa está na lista aprovada (ou após opt-in)"
    WorkflowView:
      type: object
      required: [workflow, tasks]
      description: "Workflow ativo do contrato com as tarefas visíveis ao papel"
      properties:
        workflow:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WorkflowVersion'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTask'
    ReviewInput:
      type: object
      additionalProperties: false
      description: |
        Sem campos de cliente: a proposta de revisão carrega definições e tarefas
        atuais carregadas pelo servidor (FR-022); texto livre do chamador não é
        aceito, persistido nem enviado.
    ReviewSummary:
      type: object
      required: [id, contract_id, status]
      description: "Linha de revisão para listagem e respostas de 202"
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        status:
          type: string
          enum: [pendente, analisando, sugerido, falha, aprovada]
        error:
          type: string
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    Review:
      type: object
      required: [id, contract_id, status, definitions, tasks, proposals, conflicts]
      description: |
        Revisão na vigência (FR-022): contexto carregado (`definitions` + `tasks`)
        e proposta versionada aguardando aprovação. Conflitos de aplicação ficam em
        `conflicts` (FR-023).
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        status:
          type: string
          enum: [pendente, analisando, sugerido, falha, aprovada]
        error:
          type: string
          nullable: true
        definitions:
          $ref: '#/components/schemas/ContractDefinition'
        tasks:
          type: array
          description: "Tarefas atuais no carregamento da revisão (FR-022)"
          items:
            $ref: '#/components/schemas/WorkflowTask'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/RevisionProposal'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/RevisionConflict'
        created_by:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    RevisionProposal:
      type: object
      required: [id, review_id, op]
      description: |
        Mudança proposta pela revisão (AD-009). `op: criar` cria tarefa nova (sempre
        em `A Fazer`) e exige `changes.title`; `op: editar` altera campos da tarefa
        alvo (`task_id`). `justificativa` explica a mudança (rastreabilidade).
      properties:
        id:
          type: integer
        review_id:
          type: integer
        op:
          type: string
          enum: [criar, editar]
        task_id:
          type: integer
          nullable: true
          description: "Tarefa alvo da edição; nula em `criar`"
        changes:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            priority:
              type: string
              enum: [low, medium, high, urgent]
            assignee_id:
              type: integer
              nullable: true
            due_date:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
        justificativa:
          type: string
          nullable: true
    RevisionConflict:
      type: object
      required: [id, review_id, task_id, motivo]
      description: |
        Mudança da revisão não aplicada por atingir tarefa iniciada ou concluída
        (Glossário "Conflito", FR-023). Devolvido com 200 na aplicação.
      properties:
        id:
          type: integer
        review_id:
          type: integer
        task_id:
          type: integer
        motivo:
          type: string
          example: "Tarefa em Em Progresso — mudança não aplicada"
    ReviewApplyResult:
      type: object
      required: [review, applied, conflicts]
      description: "Resultado da aplicação aprovada da revisão (FR-023)"
      properties:
        review:
          $ref: '#/components/schemas/ReviewSummary'
        applied:
          type: object
          required: [edited, created]
          properties:
            edited:
              type: integer
              description: "Tarefas em A Fazer alteradas"
            created:
              type: integer
              description: "Tarefas novas criadas em A Fazer"
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/RevisionConflict'
    ExecutionPlan:
      type: object
      required: [id, task_id, status]
      description: |
        Plano de execução da tarefa (`execution_plans`): passos, critérios verificáveis
        e riscos (FR-014). Estado `pendente → gerado | falha`; `falha → pendente` na
        regeneração. O plano nunca altera status, conclusão, fotos nem histórico (FR-016).
      properties:
        id:
          type: integer
        task_id:
          type: integer
        suggestion_version:
          type: integer
          nullable: true
          description: "Versão de sugestão que originou a tarefa"
        status:
          type: string
          enum: [pendente, gerado, falha]
        passos:
          type: array
          items:
            type: string
        criterios:
          type: array
          items:
            type: string
        riscos:
          type: array
          items:
            type: string
        erro:
          type: string
          nullable: true
          description: "Motivo da falha quando `status: falha`"
        created_at:
          type: string
    OpencodeConfig:
      type: object
      required: [enabled, timeout_ms]
      description: "Configuração da integração OpenCode (NEW-CONFIG, FR-018/FR-020)"
      properties:
        enabled:
          type: boolean
          description: "Flag geral da integração"
        timeout_ms:
          type: integer
          minimum: 1000
          default: 60000
          description: |
            Timeout do job; ao estourar o estado vira `falha` com retry manual
            (FR-018). 30000 ms é meta de UX (SC-002), não é configurável.
        context_allowlist:
          type: array
          readOnly: true
          description: "Campos permitidos no payload ao OpenCode (FR-004/FR-020)"
          items:
            type: string
          example: [finalidade, limitacoes, alvo, escopo, premissas, entregaveis, identificacao, vigencia]
        updated_at:
          type: string
          nullable: true
    OpencodeConfigInput:
      type: object
      minProperties: 1
      description: "Ajuste parcial da configuração"
      properties:
        enabled:
          type: boolean
        timeout_ms:
          type: integer
          minimum: 1000
          default: 60000
    WorkflowEvent:
      type: object
      required: [event, contractId, workflowVersionId]
      description: |
        Payload do evento Socket.io `workflow_activated` emitido na sala
        `domain_<domainId>` na ativação (FR-012). Chaves em camelCase, convenção do
        payload dos eventos existentes (`task:updated`).
      properties:
        event:
          type: string
          enum: [workflow_activated]
        contractId:
          type: integer
        workflowVersionId:
          type: integer
    AnalysisStateEvent:
      type: object
      required: [contractId, status]
      description: |
        Payload do evento Socket.io `analysis_state` emitido a cada transição do job
        de análise na sala `domain_<domainId>` (FR-021), complementando o polling.
      properties:
        contractId:
          type: integer
        suggestionId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pendente, analisando, sugerido, falha, aprovada]
        error:
          type: string
          nullable: true
    TaskUpdatedEvent:
      type: object
      required: [taskId, contractId, action, status]
      description: |
        Payload do evento existente `task:updated` (convenção de `backend/src/routes/tasks.js`).
        A aplicação de revisão emite `action: "created"` para cada tarefa criada (FR-023).
      properties:
        taskId:
          type: integer
        contractId:
          type: integer
        action:
          type: string
          enum: [created, status, completed, reopened]
        status:
          type: string
x-socket-events:
  - name: workflow_activated
    transport: socket.io
    room: "domain_<domainId>"
    fr: [FR-012]
    emittedBy:
      - "POST /api/suggestions/{sid}/approve"
    schema: '#/components/schemas/WorkflowEvent'
  - name: analysis_state
    transport: socket.io
    room: "domain_<domainId>"
    fr: [FR-021]
    emittedBy:
      - "POST /api/contracts/{id}/analysis"
      - "POST /api/contracts/{id}/analysis/retry"
      - "job de análise (transições pendente → analisando → sugerido | falha)"
    note: "Revisões não têm evento próprio — estado acompanhado por polling em GET /api/contracts/{id}/review/{rid}"
    schema: '#/components/schemas/AnalysisStateEvent'
  - name: task:updated
    transport: socket.io
    room: "domain_<domainId>"
    status: existente
    fr: [FR-023]
    emittedBy:
      - "POST /api/contracts/{id}/review/{rid}/apply (somente tarefas criadas, action created)"
    note: "Evento já usado por POST /api/contracts/:id/tasks e transições de status; opt-in e edições de campos não emitem, como PUT /api/tasks/:id"
    schema: '#/components/schemas/TaskUpdatedEvent'
